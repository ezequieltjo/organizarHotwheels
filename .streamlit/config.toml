[theme]
base = "light"
primaryColor = "#ea1c2c"
font = "Barlow"

[theme.light]
backgroundColor = "#faf9f7"
secondaryBackgroundColor = "#f0ede8"
textColor = "#201d1a"

[theme.dark]
base = "dark"
primaryColor = "#ea1c2c"
backgroundColor = "#17151a"
secondaryBackgroundColor = "#211e24"
textColor = "#f2efe9"

# serve ./static em /app/static/... — thumbs vão por URL (cacheáveis pelo
# navegador) em vez de base64 reenviado a cada rerun
[server]
enableStaticServing = true

